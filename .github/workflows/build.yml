name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - name: Install FFmpeg (full GPL build)
        shell: pwsh
        run: ./tools/get_ffmpeg.ps1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRENO_WITH_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Check
        shell: bash
        run: test -f build/bin/reno.exe && test -f build/bin/reno_cli.exe

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/bin/* -DestinationPath reno-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: reno-windows-x64
          path: reno-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libxkbcommon-dev patchelf

      - name: Install FFmpeg (full GPL build)
        run: ./tools/get_ffmpeg.sh

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRENO_WITH_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Check
        run: test -f build/bin/reno && test -f build/bin/reno_cli

      - name: Package
        run: |
          cp -a deps/ffmpeg/lib/*.so* build/bin/
          for f in build/bin/reno build/bin/reno_cli; do patchelf --set-rpath '$ORIGIN' "$f"; done
          tar -C build/bin -czf reno-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: reno-linux-x64
          path: reno-linux-x64.tar.gz

  macos:
    runs-on: macos-14
    # (the macOS build is new and untested: a failure here doesn't block the other builds or a release)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: brew install ninja ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRENO_WITH_TESTS=OFF -DRENO_FFMPEG_DIR="$(brew --prefix)"

      - name: Build
        run: cmake --build build

      - name: Check
        run: test -f build/bin/reno && test -f build/bin/reno_cli

      - name: Package
        run: tar -C build/bin -czf reno-macos-arm64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: reno-macos-arm64
          path: reno-macos-arm64.tar.gz

  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
